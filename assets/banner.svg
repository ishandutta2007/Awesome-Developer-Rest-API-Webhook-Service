<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-flow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-orb-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.1); }
      }
      @keyframes float-orb-2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-25px, 25px) scale(1.15); }
      }
      @keyframes ping-node {
        0%, 100% { r: 6; opacity: 0.9; }
        50% { r: 9; opacity: 0.4; }
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: pulse-flow 3s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 10;
        animation: pulse-flow 4s linear infinite reverse;
      }
      .orb-1 {
        animation: float-orb-1 8s ease-in-out infinite;
      }
      .orb-2 {
        animation: float-orb-2 10s ease-in-out infinite;
      }
      .node-pulse {
        animation: ping-node 2.5s ease-in-out infinite;
      }
      .pill-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Background Orbs -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="100" r="140" fill="url(#accent-cyan)" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="url(#accent-purple)" filter="url(#glow)" />
  </g>

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyber-grid)" rx="16" />

  <!-- Dynamic Network / Flow Topology in Background -->
  <g opacity="0.45">
    <!-- Connecting Stream Lines -->
    <path d="M 80 80 Q 300 30 600 70 T 1120 60" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" />
    <path d="M 60 360 Q 380 390 650 340 T 1140 350" fill="none" stroke="#a855f7" stroke-width="2" class="flow-line-reverse" />
    <path d="M 120 200 C 350 140 850 280 1080 210" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8" class="flow-line" />

    <!-- Topology Router / Gateway Nodes -->
    <circle cx="160" cy="70" r="5" fill="#38bdf8" />
    <circle cx="160" cy="70" class="node-pulse" fill="#38bdf8" />
    
    <circle cx="600" cy="70" r="6" fill="#818cf8" />
    <circle cx="600" cy="70" class="node-pulse" fill="#818cf8" />
    
    <circle cx="1060" cy="65" r="5" fill="#c084fc" />
    <circle cx="1060" cy="65" class="node-pulse" fill="#c084fc" />

    <circle cx="240" cy="365" r="5" fill="#38bdf8" />
    <circle cx="780" cy="345" r="6" fill="#c084fc" />
    <circle cx="780" cy="345" class="node-pulse" fill="#c084fc" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Tech Category Tags / Feature Pills -->
  <g transform="translate(0, 65)">
    <!-- Pill 1: REST API Gateway -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4" fill="#38bdf8" />
      <text x="32" y="21" fill="#e2e8f0" class="pill-badge">REST API GATEWAY</text>
    </g>

    <!-- Pill 2: Webhook Ingress -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4" fill="#818cf8" />
      <text x="32" y="21" fill="#e2e8f0" class="pill-badge">WEBHOOK INGRESS</text>
    </g>

    <!-- Pill 3: Outbound Delivery -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="195" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4" fill="#c084fc" />
      <text x="32" y="21" fill="#e2e8f0" class="pill-badge">OUTBOUND DELIVERY</text>
    </g>

    <!-- Pill 4: Event-Driven Arch -->
    <g transform="translate(795, 0)">
      <rect x="0" y="0" width="215" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4" fill="#34d399" />
      <text x="32" y="21" fill="#e2e8f0" class="pill-badge">EVENT-DRIVEN ARCH</text>
    </g>
  </g>

  <!-- Main Hero Title & Foreground Texts -->
  <g text-anchor="middle">
    <!-- Super Title / Category Header -->
    <text x="600" y="160" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="3">
      CURATED DEVELOPER ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="222" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome Developer REST API &amp; Webhooks
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="268" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="0.2">
      Production API Gateways, Inbound Ingress Proxies &amp; Reliable Outbound Delivery Engines
    </text>

    <!-- Highlights Bar -->
    <text x="600" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Low Latency Routing &#183; HMAC &amp; RFC 9421 Verification &#183; Exponential Retries &amp; DLQ &#183; Transparent SaaS &amp; OSS
    </text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#primary-glow)" />
</svg>
